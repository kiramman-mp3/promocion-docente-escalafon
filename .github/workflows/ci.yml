name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Un push nuevo cancela la ejecución anterior de la misma rama
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar dependencias
        run: dotnet restore PromocionDocente.sln

      - name: Lint (dotnet format)
        run: dotnet format PromocionDocente.sln --verify-no-changes --no-restore

      - name: Compilar
        run: dotnet build PromocionDocente.sln --no-restore --configuration Release

      - name: Pruebas unitarias
        run: >
          dotnet test PromocionDocente.sln --no-build --configuration Release
          --logger "trx;LogFileName=resultados.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-api
          path: TestResults

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Verificar tipos (TypeScript)
        run: npm run typecheck

      - name: Pruebas unitarias con cobertura
        run: npm run test:coverage

      - name: Compilar
        run: npm run build

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage

  e2e:
    name: Punta a punta (docker-compose)
    needs: [api, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Secretos de un solo uso: la base se crea y se destruye en este job
      - name: Crear .env
        run: |
          {
            echo "MSSQL_SA_PASSWORD=Sa$(openssl rand -hex 16)Aa1!"
            echo "APP_DB_USER=app_uta"
            echo "APP_DB_PASSWORD=Ap$(openssl rand -hex 16)Bb2!"
            echo "JWT_KEY=$(openssl rand -hex 48)"
            echo "SEED_DATA=true"
            echo "LOGIN_RATE_LIMIT=100"
          } > .env

      - name: Levantar SQL Server, API y frontend
        run: docker compose up -d --build

      - name: Prueba de punta a punta
        run: bash tests/e2e/api-smoke.sh

      - name: Respaldo y verificación de la base
        run: docker compose --profile operacion run --rm db-backup

      # Escaneo de seguridad pasivo (Reglamento DITIC art. 23 f). -I: las advertencias no fallan el job
      - name: OWASP ZAP (frontend y API)
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8080 -r zap-frontend.html -I
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py -t http://localhost:5270/swagger/v1/swagger.json -f openapi -r zap-api.html -I

      - name: Publicar informes de seguridad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seguridad-zap
          path: zap/*.html
          if-no-files-found: ignore

      - name: Logs de los contenedores
        if: failure()
        run: docker compose logs --no-color

      - name: Apagar
        if: always()
        run: docker compose down -v
