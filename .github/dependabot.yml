version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    target-branch: develop

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    target-branch: develop
    groups:
      dependencias-de-desarrollo:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: develop

  - package-ecosystem: docker
    directory: /ApiREST_UTA
    schedule:
      interval: monthly
    target-branch: develop

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
    target-branch: develop
